<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>D&D Fighting Order</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct link such as /DnD-fighting-orderer/<id> lands here.
      // Redirect to the app's index page with the path moved into the query string; index.html restores it.
      // segmentCount = 1 keeps the "/DnD-fighting-orderer" project segment.
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
